[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rialto-shared-types"
version = "0.1.0"
description = "Shared Pydantic types for Rialto services"
authors = [
    {name = "Rialto Team", email = "dev@rialto-financial.com"},
]
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "email-validator>=2.2.0,<3.0.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=25.0.0",
    "isort>=6.0.0",
    "flake8>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rialto_shared_types"]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88